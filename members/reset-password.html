<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restablecer Contraseña — EduS Trader</title>
  <!-- SEO -->
  <meta name="robots" content="noindex, nofollow">
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0f1e;
      --card: #1e293b;
      --text: #e2e8f0;
      --light: #94a3b8;
      --teal: #3dd6c0;
      --teal-dark: #2bb8a4;
      --err: #e05252;
    }
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: var(--card);
      width: 100%;
      max-width: 400px;
      padding: 40px;
      border-radius: 16px;
      border: 1px solid rgba(61,214,192,0.15);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .logo {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 24px;
      color: var(--teal);
      text-align: center;
      margin-bottom: 24px;
      letter-spacing: -0.02em;
    }
    .logo span { color: var(--text); }
    
    h1 {
      font-size: 20px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 8px;
    }
    p {
      color: var(--light);
      font-size: 14px;
      text-align: center;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--light);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg);
      border: 1px solid #334155;
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      margin-bottom: 20px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: var(--teal); }
    
    button {
      width: 100%;
      padding: 14px;
      background: var(--teal);
      color: var(--bg);
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      font-family: 'Montserrat', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: var(--teal-dark); }
    button:disabled { background: #475569; cursor: not-allowed; }
    
    .msg {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      display: none;
      text-align: center;
    }
    .msg.error {
      background: rgba(224,82,82,0.1);
      border: 1px solid rgba(224,82,82,0.3);
      color: var(--err);
    }
    .msg.success {
      background: rgba(61,214,192,0.1);
      border: 1px solid rgba(61,214,192,0.3);
      color: var(--teal);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo">EduS <span>Trader</span></div>
    <h1>Crear nueva contraseña</h1>
    <p>Ingresa tu nueva contraseña para acceder a tu cuenta.</p>
    
    <div id="form-area">
      <label>Nueva Contraseña</label>
      <input type="password" id="pwd" placeholder="Mín. 8 caracteres, 1 mayúscula, 1 número">
      
      <button id="btn" onclick="resetPassword()">Restablecer contraseña →</button>
    </div>
    
    <div id="msg" class="msg"></div>
    
    <div style="text-align:center; margin-top:24px;">
      <a href="/members/" style="color:var(--teal); text-decoration:none; font-size:13px; font-weight:600;">← Volver al login</a>
    </div>
  </div>

  <script>
    async function resetPassword() {
      const pwd = document.getElementById('pwd').value;
      const btn = document.getElementById('btn');
      const msg = document.getElementById('msg');
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');
      
      msg.style.display = 'none';
      msg.className = 'msg error';
      
      if (!token) {
        msg.textContent = 'El enlace no es válido o está incompleto.';
        msg.style.display = 'block';
        return;
      }
      if (pwd.length < 8 || !/[A-Z]/.test(pwd) || !/[0-9]/.test(pwd)) {
        msg.textContent = 'Debe tener al menos 8 caracteres, una mayúscula y un número.';
        msg.style.display = 'block';
        return;
      }
      
      btn.textContent = 'Actualizando...';
      btn.disabled = true;
      
      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password: pwd })
        });
        const data = await res.json();
        
        if (res.ok) {
          document.getElementById('form-area').style.display = 'none';
          msg.className = 'msg success';
          msg.textContent = '¡Contraseña actualizada con éxito! Ya puedes iniciar sesión.';
          msg.style.display = 'block';
        } else {
          msg.textContent = data.error || 'No se pudo actualizar la contraseña.';
          msg.style.display = 'block';
          btn.textContent = 'Restablecer contraseña →';
          btn.disabled = false;
        }
      } catch (err) {
        msg.textContent = 'Error de conexión. Inténtalo de nuevo.';
        msg.style.display = 'block';
        btn.textContent = 'Restablecer contraseña →';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
