<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watchlist de Inversiones - EduSTrader</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/inv-styles.css">
</head>
<body class="inversiones-app">

    <header class="inv-header">
        <div class="header-left">
            <img class="logo-img" src="/assets/logo.png" alt="EduS Inversiones" onerror="this.style.display='none'">
            <div class="brand">
                <div class="brand-name">EduS <span class="gold">Inversiones</span></div>
                <div class="brand-sub">PORTAFOLIO & ANÁLISIS DE INVERSIÓN · Mesa de Dinero</div>
            </div>
        </div>
        <nav class="inv-nav">
            <a href="index.html">Portafolio</a>
            <a href="watchlist.html" class="active">Watchlist</a>
            <a href="scanner.html">Scanner</a>
            <a href="/index.html">← Inicio</a>
        </nav>
    </header>

    <main class="inv-container">
        <div class="inv-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <div style="display: flex; gap: 1rem; align-items: center;">
                    <h2 style="margin:0; font-size: 1.25rem;">Acciones en Seguimiento</h2>
                    <select id="sector-filter" class="form-control" onchange="loadWatchlist()" style="padding: 0.5rem;">
                        <option value="all">Todos los Sectores</option>
                    </select>
                </div>
                <button class="form-control" style="cursor: pointer; background: var(--inv-accent); color: white; border: none; font-weight: 600;">
                    + Añadir Ticker
                </button>
            </div>

            <div class="inv-table-wrapper">
                <table class="inv-table" id="watchlist-table">
                    <thead>
                        <tr>
                            <th>Ticker</th>
                            <th>Sector</th>
                            <th style="text-align: right;">Precio Actual</th>
                            <th style="text-align: right;">Var. Día</th>
                            <th>Rango 52w</th>
                            <th>PEG</th>
                            <th>DCF</th>
                            <th>DDM</th>
                            <th>PBV</th>
                            <th style="text-align: center;">Score</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="10" style="text-align: center; color: var(--inv-text-secondary);">Cargando watchlist...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="assets/inv-dashboard.js"></script>
    <script>
        async function loadWatchlist() {
            const tableBody = document.querySelector('#watchlist-table tbody');
            const sectorFilter = document.getElementById('sector-filter');
            const filterVal = sectorFilter.value;
            
            tableBody.innerHTML = `<tr><td colspan="10" style="text-align: center;">Cargando watchlist...</td></tr>`;

            try {
                const res = await fetch(`/api/inversiones/watchlist?sector=${filterVal}`);
                const { success, data, error } = await res.json();
                if (!success) throw new Error(error);

                // Populate sector filter if it's the first load
                if (sectorFilter.options.length === 1 && data.sectors) {
                    data.sectors.forEach(s => {
                        const opt = document.createElement('option');
                        opt.value = s;
                        opt.textContent = s;
                        sectorFilter.appendChild(opt);
                    });
                }

                if (data.tickers.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="10" style="text-align: center;">No hay acciones en este sector.</td></tr>`;
                    return;
                }

                tableBody.innerHTML = data.tickers.map(p => {
                    const priceChgColor = p.price_change_pct >= 0 ? 'var(--signal-subvalorada)' : 'var(--signal-sobrevalorada)';
                    return `
                    <tr>
                        <td>
                            <a href="ticker.html?symbol=${p.ticker}" class="ticker-link">${p.ticker}</a>
                            <div class="text-xs text-muted">${p.name || '--'}</div>
                        </td>
                        <td class="text-sm">${p.sector || p.instrument_type}</td>
                        <td style="text-align: right;" class="font-medium">${formatMoney(p.last_price)}</td>
                        <td style="text-align: right;" class="font-bold">
                            <span style="color: ${priceChgColor}">
                                ${formatPct(p.price_change_pct * 100)}
                            </span>
                        </td>
                        <td>
                            <div style="width: 100px; height: 4px; background: var(--inv-border); border-radius: 2px; position: relative; margin-top: 4px;">
                                <div style="position: absolute; width: 4px; height: 10px; background: var(--inv-text-primary); top: -3px; left: ${p.position_52w_pct}%;"></div>
                            </div>
                            <div class="text-xs text-muted" style="display: flex; justify-content: space-between; margin-top: 4px;">
                                <span>${p.week_52_low ? Math.round(p.week_52_low) : ''}</span>
                                <span>${p.week_52_high ? Math.round(p.week_52_high) : ''}</span>
                            </div>
                        </td>
                        <td><span class="signal-dot dot-${(p.peg_signal||'na').toLowerCase()}"></span> ${p.peg_value ? p.peg_value.toFixed(2) : ''}</td>
                        <td><span class="signal-dot dot-${(p.dcf_signal||'na').toLowerCase()}"></span></td>
                        <td><span class="signal-dot dot-${(p.ddm_signal||'na').toLowerCase()}"></span></td>
                        <td><span class="signal-dot dot-${(p.pbv_signal||'na').toLowerCase()}"></span></td>
                        <td style="text-align: center;">${getScoreStars(p.positive_signals)}</td>
                    </tr>
                `}).join('');

            } catch (err) {
                console.error(err);
                tableBody.innerHTML = `<tr><td colspan="10" style="text-align: center; color: var(--signal-sobrevalorada);">Error cargando datos</td></tr>`;
            }
        }

        document.addEventListener('DOMContentLoaded', loadWatchlist);
    </script>
</body>
</html>
