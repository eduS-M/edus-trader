<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner de Oportunidades — EduS Inversión</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=DM+Sans:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/inv-styles.css?v=4">
    <style>
      :root{--edus-teal:#3dd6c0;--edus-gold:#b38665;--inv-bg-main:#0B0F14;--inv-bg-card:#141B24;--inv-border:#1E2D3D;--inv-text-primary:#E2E8F0;--inv-text-secondary:#94A3B8;}
      *{box-sizing:border-box;margin:0;padding:0}
      body{background:#0B0F14;color:#E2E8F0;font-family:'Inter',-apple-system,sans-serif;overflow-x:hidden}
      body>main{padding-top:62px}
      .inv-header{background:linear-gradient(135deg,#142d37 0%,#034649 100%);border-bottom:2px solid #b38665;padding:0 2rem;display:flex;justify-content:space-between;align-items:center;position:fixed;top:0;left:0;right:0;z-index:9999;height:62px;font-family:'Montserrat',sans-serif}
      .inv-brand{display:flex;align-items:center;gap:12px;text-decoration:none;flex-shrink:0}
      .inv-brand img{height:38px;width:auto;display:block}
      .inv-brand-name{font-family:'DM Sans','Montserrat',sans-serif;font-size:20px;font-weight:700;letter-spacing:-0.5px;color:#fff;white-space:nowrap;line-height:1}
      .inv-brand-name .gold{color:#b38665}.inv-brand-name .teal{color:#3dd6c0}
      .inv-nav{display:flex;align-items:center;gap:2px;list-style:none}
      .inv-nav a{display:block;padding:8px 14px;text-decoration:none;color:rgba(255,255,255,.82);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;transition:background 0.15s,color 0.15s;border-radius:4px;white-space:nowrap;font-family:'Montserrat',sans-serif}
      .inv-nav a:hover{background:rgba(255,255,255,.12);color:#fff}
      .inv-nav a.active{background:rgba(61,214,192,0.15);color:#3dd6c0}
      .inv-nav a.back-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.7)}
      .inv-container{max-width:98%;width:100%;margin:0 auto;padding:2rem}
      .inv-card{background:#141B24;border:1px solid #1E2D3D;border-radius:12px;padding:1.5rem;box-shadow:0 4px 24px rgba(0,0,0,0.3);transition:border-color 0.2s;margin-bottom:1.5rem}
      .inv-card:hover{border-color:rgba(61,214,192,0.2)}
      .inv-table-wrapper{overflow-x:auto;border:1px solid #1E2D3D;border-radius:12px;background:#141B24;-webkit-overflow-scrolling:touch}
      .inv-table{width:100%;border-collapse:collapse;text-align:left}
      .inv-table th{background:rgba(61,214,192,0.04);color:#3dd6c0;font-weight:700;font-size:0.68rem;text-transform:uppercase;letter-spacing:0.05em;padding:0.75rem 0.7rem;border-bottom:1px solid #1E2D3D;white-space:nowrap;font-family:'Montserrat',sans-serif}
      .inv-table td{padding:0.7rem 0.7rem;border-bottom:1px solid #1E2D3D;vertical-align:middle;font-size:0.82rem}
      .inv-table tbody tr:hover{background:rgba(61,214,192,0.03)}
      .inv-table tbody tr:last-child td{border-bottom:none}
      .signal-badge{display:inline-flex;align-items:center;justify-content:center;padding:0.18rem 0.6rem;border-radius:9999px;font-size:0.67rem;font-weight:700;text-transform:uppercase;letter-spacing:0.03em;font-family:'Montserrat',sans-serif}
      .signal-subvalorada{background:rgba(16,185,129,0.12);color:#10B981;border:0.5px solid rgba(16,185,129,0.3)}
      .signal-justo{background:rgba(61,214,192,0.12);color:#3dd6c0;border:0.5px solid rgba(61,214,192,0.3)}
      .signal-invertible{background:rgba(201,168,76,0.12);color:#c9a84c;border:0.5px solid rgba(201,168,76,0.3)}
      .signal-sobrevalorada{background:rgba(239,68,68,0.12);color:#EF4444;border:0.5px solid rgba(239,68,68,0.3)}
      .signal-na{background:rgba(75,85,99,0.12);color:#4B5563;border:0.5px solid rgba(75,85,99,0.3)}
      .score-stars{display:flex;gap:3px}.star{width:14px;height:14px;fill:#1E2D3D}.star.filled{fill:#c9a84c}.star.excellent{fill:#10B981}
      .text-xs{font-size:0.72rem}.text-muted{color:#94A3B8}.font-bold{font-weight:700}.font-medium{font-weight:500}
      .ticker-link{color:#3dd6c0;text-decoration:none;font-weight:700;font-size:0.88rem;transition:color 0.15s;font-family:'Montserrat',sans-serif}
      .ticker-link:hover{color:#fff;text-decoration:underline}
      .form-control{background:#0B0F14;border:1px solid #1E2D3D;color:#E2E8F0;padding:0.65rem 0.75rem;border-radius:6px;font-family:'Inter',sans-serif;transition:border-color 0.15s}
      .form-control:focus{outline:none;border-color:#3dd6c0}
      .form-group{display:flex;flex-direction:column;gap:0.5rem}
      .form-group label{font-size:0.78rem;color:#94A3B8;font-family:'Montserrat',sans-serif;text-transform:uppercase;letter-spacing:0.04em;font-weight:700}
    </style>
</head>
<body class="inversiones-app">
    <header class="inv-header">
        <a class="inv-brand" href="/inversiones/">
            <img src="/assets/logo.png" alt="EduS Inversión" onerror="this.style.display='none'">
            <span class="inv-brand-name">Edu<span class="gold">S</span> <span class="teal">Inversión</span></span>
        </a>
        <nav class="inv-nav">
            <a href="index.html">Portafolio</a>
            <a href="watchlist.html">Watchlist</a>
            <a href="scanner.html" class="active">Scanner</a>
            <a href="https://edustrader.pages.dev/members/" class="back-btn">← Zona Miembros</a>
        </nav>
    </header>

    <main class="inv-container">
        <div class="inv-card">
            <div style="display:flex;gap:1rem;align-items:flex-end;flex-wrap:wrap;">
                <div class="form-group" style="flex:1;min-width:260px;">
                    <label>Filtro de Valoración</label>
                    <select id="scanner-filter" class="form-control">
                        <option value="subvaloradas">Mejores Oportunidades (Quick Check + DCF Subvalorado)</option>
                        <option value="peg_only">Subvaloradas por Quick Check (PEG &lt; 1)</option>
                        <option value="dcf_only">Subvaloradas por DCF</option>
                        <option value="top_score">Top Score (3+ Señales Positivas)</option>
                        <option value="all">Ver todo el universo S&amp;P 500</option>
                    </select>
                </div>
                <button onclick="loadScanner()" style="background:#3dd6c0;color:#0d1f26;border:none;font-weight:800;padding:0.7rem 1.75rem;cursor:pointer;font-family:'Montserrat',sans-serif;text-transform:uppercase;font-size:0.78rem;letter-spacing:0.05em;border-radius:6px;white-space:nowrap;transition:opacity 0.2s;" onmouseover="this.style.opacity='.85'" onmouseout="this.style.opacity='1'">
                    🔍 Escanear Mercado
                </button>
            </div>
        </div>

        <div class="inv-card">
            <h2 style="margin-top:0;margin-bottom:1.25rem;font-size:1.1rem;font-family:'Montserrat',sans-serif;">Resultados del Scanner</h2>
            <div class="inv-table-wrapper">
                <table class="inv-table" id="scanner-table">
                    <thead>
                        <tr>
                            <th>Ticker / Empresa</th>
                            <th>Sector</th>
                            <th style="text-align:right;">Precio</th>
                            <th style="text-align:right;">PEG</th>
                            <th style="text-align:right;">Dif DCF %</th>
                            <th>Señal DCF</th>
                            <th>Señal PBV</th>
                            <th style="text-align:center;">Score</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td colspan="9" style="text-align:center;padding:2rem;color:#94A3B8;">Selecciona un filtro y haz clic en Escanear</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="assets/inv-dashboard.js?v=4"></script>
</body>
</html>
