<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner de Oportunidades - EduSTrader</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/inv-styles.css">
</head>
<body class="inversiones-app">

    <header class="inv-header">
        <div style="display: flex; align-items: center; gap: 1rem;">
            <img src="/Logo 6 EduS Trader-6.png" alt="EduSTrader" height="32">
            <h1 style="font-size: 1.25rem; font-weight: 600; margin: 0;">Scanner</h1>
        </div>
        <nav class="inv-nav">
            <a href="index.html">Portafolio</a>
            <a href="watchlist.html">Watchlist</a>
            <a href="scanner.html" class="active">Scanner</a>
            <a href="/index.html">← Volver</a>
        </nav>
    </header>

    <main class="inv-container">
        
        <div class="inv-card" style="margin-bottom: 2rem;">
            <div style="display: flex; gap: 1rem; align-items: flex-end;">
                <div class="form-group" style="flex: 1;">
                    <label>Filtro de Valoración</label>
                    <select id="scanner-filter" class="form-control">
                        <option value="subvaloradas">Mejores Oportunidades (Quick Check + DCF Subvalorado)</option>
                        <option value="peg_only">Subvaloradas por Quick Check (PEG < 1)</option>
                        <option value="dcf_only">Subvaloradas por DCF</option>
                        <option value="top_score">Top Score (3+ Señales Positivas)</option>
                        <option value="all">Ver todo el universo S&P 500</option>
                    </select>
                </div>
                <button onclick="loadScanner()" class="form-control" style="background: var(--inv-accent); color: white; border: none; font-weight: 600; padding: 0.75rem 1.5rem; cursor: pointer;">
                    Escanear Mercado
                </button>
            </div>
        </div>

        <div class="inv-card">
            <h2 style="margin-top:0; font-size: 1.25rem; margin-bottom: 1.5rem;">Resultados del Scanner</h2>
            <div class="inv-table-wrapper">
                <table class="inv-table" id="scanner-table">
                    <thead>
                        <tr>
                            <th>Ticker</th>
                            <th>Sector</th>
                            <th style="text-align: right;">Precio</th>
                            <th style="text-align: right;">Quick Check (PEG)</th>
                            <th style="text-align: right;">Dif DCF %</th>
                            <th>Señal DCF</th>
                            <th>Señal PBV</th>
                            <th style="text-align: center;">Score Global</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="9" style="text-align: center; color: var(--inv-text-secondary);">Selecciona un filtro y haz clic en Escanear</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script src="assets/inv-dashboard.js"></script>
</body>
</html>
